      <style>

<div class="cap1">czas ładowania</div>

      <script>
        (function () {
          var R = "#s02-root ";
          var $ = function (s) { return R + s; };
          var E = "power3.out", IO = "power2.inOut";
          var tl = gsap.timeline({ paused: true });
          function count(sel, from, to, t, d, fmt) {
            var el = document.querySelector(R + sel);
            var o = { v: from };
            var f = fmt || function (v) { return Math.round(v).toLocaleString("en-US"); };
            tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: function () { el.textContent = f(o.v); } }, t);
          }
          function draw(sel, t, d) {
            tl.fromTo($(sel), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out" }, t);
          }
          tl.fromTo($(".stage"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, 0);
          var WX = [0], WY = [0];
          function WARP(t) { var X = WX, Y = WY, n = X.length; if (t <= X[0]) return t; if (t >= X[n - 1]) return Y[n - 1] + (t - X[n - 1]);
  for (var i = 1; i < n; i++) if (t <= X[i]) { var k = X[i] === X[i - 1] ? 0 : (t - X[i - 1]) / (X[i] - X[i - 1]); return Y[i - 1] + k * (Y[i] - Y[i - 1]); } return t; }
          var T = function (g) { return WARP(g) - 3.85; };

tl.fromTo($(".ttl"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(4.0));
tl.fromTo($(".cap1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(5.0));
tl.fromTo($(".trk"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(5.0));
tl.fromTo($(".trk .a"), { scale: 0.7 }, { scale: 1, duration: 0.3, ease: E }, T(6.1));
tl.fromTo($(".trk .fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: IO }, T(6.2));
tl.fromTo($(".trk .b"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, T(6.5));
tl.fromTo($(".lab"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(7.2));
tl.fromTo($(".big"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, T(9.1));
count(".big", 0, 32, T(9.15), 0.6, function (v) { return "+" + Math.round(v) + "%"; });
tl.fromTo($(".src"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(9.8));

          tl.to($(".stage"), { opacity: 0, scale: 0.97, duration: 0.3, ease: "power2.in" }, 6.15);
          window.__timelines["s02"] = tl;
